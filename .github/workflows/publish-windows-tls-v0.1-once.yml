# One-time release publisher: remove after the tag and release have been verified.
name: Publish Windows TLS v0.1 (one-time)

on:
  workflow_run:
    workflows: ["CI", "Windows TLS Evidence Dataset"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-windows-tls-v0.1
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: windows-tls-reality-check-v0.1
      VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Validate main and publish versioned research artifact
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main" != "$VALIDATED_SHA" ]]; then
            echo "Skip: main moved since this workflow run"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/contents/docs/windows-tls-reality-check/v0.1/results.csv?ref=${VALIDATED_SHA}" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/contents/docs/windows-tls-reality-check/v0.1/README.md?ref=${VALIDATED_SHA}" >/dev/null

          ci_ok="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${VALIDATED_SHA}&per_page=100" --jq '[.workflow_runs[] | select(.name == "CI" and .event == "push" and .conclusion == "success")] | length')"
          data_ok="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${VALIDATED_SHA}&per_page=100" --jq '[.workflow_runs[] | select(.name == "Windows TLS Evidence Dataset" and .event == "push" and .conclusion == "success")] | length')"
          if [[ "$ci_ok" -lt 1 || "$data_ok" -lt 1 ]]; then
            echo "Skip: waiting for both required checks (CI=$ci_ok, Evidence=$data_ok)"
            exit 0
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Already released; no modification"
            exit 0
          fi

          if tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null)"; then
            if [[ "$tag_sha" != "$VALIDATED_SHA" ]]; then
              echo "Existing tag points to another commit" >&2
              exit 1
            fi
          fi

          notes="$(cat <<'NOTES'
          ## Windows TLS Reality Check v0.1

          A controlled Windows 11 TLS 1.3 study comparing Schannel-based applications (curl and PowerShell) with Edge, Chrome and Firefox.

          **Dataset:** 48 preregistered measurements plus 12 separately identified supplemental State A browser runs. The selected 60 measurements comprised 48 negotiated X25519MLKEM768 (group 4588), 9 classical X25519 (group 29), and 3 expected handshake failures against a hybrid-only TLS server. The operator recorded 57 HTTP 200 outcomes and 3 TLS errors (alert 40).

          **Validation:** 60 selected runs passed local metadata and integrity checks and a preliminary TShark packet audit; 67 available captures passed their recorded SHA-256 checks. GitHub Actions validates the public CSV consistency and regression tests, **not** the original packet captures or Windows experimental environment.

          **Research materials:** [Report](https://github.com/RebelCoding84/pqc-lab/tree/main/docs/windows-tls-reality-check/v0.1) · [Methodology](https://github.com/RebelCoding84/pqc-lab/blob/main/docs/windows-tls-reality-check/v0.1/methodology.md) · [Data](https://github.com/RebelCoding84/pqc-lab/blob/main/docs/windows-tls-reality-check/v0.1/results.csv) · [Limitations](https://github.com/RebelCoding84/pqc-lab/blob/main/docs/windows-tls-reality-check/v0.1/limitations.md)

          Browser version drift (Edge and Firefox), experimental Windows Insider support status, and the absence of quantum-safe certificate-authentication testing limit these conclusions. S2 was hybrid-only, not ML-KEM-only. PCAPNG files, private keys and VM images remain in a private archive.

          This is a versioned research artifact, not peer review, vendor certification, or evidence that all Windows TLS traffic is post-quantum secure.
          NOTES
          )"

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VALIDATED_SHA" \
            --title "Windows TLS Reality Check v0.1 — Hybrid TLS 1.3 research" \
            --latest=false \
            --notes "$notes"
